<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beyond Earth: Do Space missions matter?</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="aadiss-landing-title">
    <h1>Beyond Earth: Do Space missions matter?</h1>
  </div>

  <div class="aadiss-split-container aadiss-container-landing">
    <div class="aadiss-split aadiss-split-left">
      <div class="aadiss-split-content">
        <h1>Pros</h1>
        <p>Technological advancement, scientific discovery, and economic growth.</p>
        <a href="pros.html" class="aadiss-btn-split">Benefits</a>
      </div>
    </div>
    <div class="aadiss-split aadiss-split-right">
      <div class="aadiss-split-content">
        <h1>Cons</h1>
        <p>Space debris, environmental impact, and mission failures.</p>
        <a href="cons.html" class="aadiss-btn-split">Risks</a>
      </div>
    </div>
  </div>

  <script>
    const aadissLeft = document.querySelector('.aadiss-split-left');
    const aadissRight = document.querySelector('.aadiss-split-right');
    const aadissContainer = document.querySelector('.aadiss-split-container');

    aadissLeft.addEventListener('mouseenter', () => {
      aadissContainer.classList.add('aadiss-hover-left');
    });

    aadissLeft.addEventListener('mouseleave', () => {
      aadissContainer.classList.remove('aadiss-hover-left');
    });

    aadissRight.addEventListener('mouseenter', () => {
      aadissContainer.classList.add('aadiss-hover-right');
    });

    aadissRight.addEventListener('mouseleave', () => {
      aadissContainer.classList.remove('aadiss-hover-right');
    });
  </script>
</body>

</html>
